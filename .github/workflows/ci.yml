name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      # The scorer parity test runs docs/js/scorer.js under Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - run: uv sync --locked
      - run: make lint
      - run: make test
