# All randomness reads this seed.
seed: 42

# Raw downloads go to $CRES_DATA_DIR/raw/; everything derived goes under data/.
data_dir_env: CRES_DATA_DIR

# DuckDB spills to disk past this instead of pushing an 8 GB laptop into swap.
duckdb_memory_limit: 2GB

label:
  # late = timely_response == "No", taken from the live complaints file.
  received_from: "2017-05-01"
  # Dropped before labelling, and counted in reports/data_profile.json.
  drop_company_response: ["In progress"]

data_end:
  # Chosen from the data: the last month whose narrative count is at least
  # min_ratio times the median of the trailing_months before it.
  min_ratio: 0.7
  trailing_months: 6

windows:
  # Generated from data_end in split.py; never written out by hand.
  n_windows: 5
  test_months: 3
  val_months: 3
  gap_days: 30
  # Training uses only the most recent train_years before each window's training cutoff,
  # so the TF-IDF matrices fit in memory on an 8 GB laptop.
  train_years: 1

features:
  tfidf:
    vocab_sample: 150000     # train documents sampled (with seed) to choose the vocabulary
    min_df: 5                # in that sample
    max_features: 100000
    sublinear_tf: true       # tf -> 1 + ln(tf); idf = ln((1 + n) / (1 + df)) + 1; rows L2-normalised
  categorical_min_frequency: 20   # rarer categories share one "infrequent" column
  company_history:
    days: 365                # trailing window ending gap_days before the complaint
    prior_strength: 50       # additive prior: (late + a * overall_rate) / (n + a)
  workers: 7

evaluate:
  capacity: [0.01, 0.05]     # review capacity: share of complaints flagged
  bootstrap_resamples: 1000  # stratified by label, on the test split
  ece_bins: 10               # equal-count bins of test scores
  costs:                     # for the cost-optimal threshold; only the ratio matters
    fp: 1                    # a complaint flagged for review that was answered on time
    fn: 10                   # a late response the model missed

models:
  lr:
    C: [0.001, 0.01, 0.1, 1.0, 10.0]  # chosen per cell on validation average precision (hill climb)
    max_iter: 2000           # lbfgs iterations; the run fails if the model hasn't converged
    tol: 1.0e-6
  lgbm:
    max_text_terms: 20000    # most frequent TF-IDF terms LightGBM sees; LR uses all of them
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 100
    feature_fraction: 0.5
    lambda_l2: 1.0
    max_bin: 63
    force_col_wise: true     # the row-wise layout takes many minutes to build for 100k sparse columns
    num_threads: 7
    num_boost_round: 2000
    early_stopping_rounds: 100   # on validation average precision
  calibration_folds: 5       # cross-fitting of validation scores for the recalibrated LR

deep:
  # Windows the deep models are expected to cover; the summary marks missing files "not run".
  windows: [W5]
  # DistilBERT and its same-data TF-IDF baseline (lr_sub) train on every train positive plus
  # this many train negatives, sampled with the seed. Scores are shifted back to the full
  # training prior: logit + ln(negatives sampled / negatives available).
  negatives: 100000
  minilm:
    model: sentence-transformers/all-MiniLM-L6-v2
    max_length: 256          # tokens; longer narratives are truncated
    batch_size: 256
    chunk: 50000             # narratives per saved embedding chunk, so a rerun resumes
  distilbert:
    model: distilbert-base-uncased
    max_length: 384
    batch_size: 32
    eval_batch_size: 256
    epochs: 3                # the checkpoint (end of an epoch) is chosen on validation AP
    learning_rate: 3.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.06

scorer:
  # The in-browser scorer (docs/js/scorer.js): an LR on the latest window's train split with
  # TF-IDF, lexicon counts and the structured fields. VADER is left out (it has no JS port).
  numeric: [days_to_company, company_late_rate, company_log_volume, urgency, harm]
  # Terms kept after the first fit, ranked by mean |coefficient x TF-IDF| on train, so the
  # bundle stays under max_bundle_mb. The model is refitted on just these terms.
  max_terms: 50000
  max_bundle_mb: 3
  digits: 7                  # significant digits of every number in the bundle
  # The company explorer and the scorer's company lookup cover companies with at least this
  # many labelled complaints across the latest window's splits.
  company_min_complaints: 500
  # Narratives of this many seeded validation rows are re-scored through the reference scorer
  # to check that the bundle reproduces the fitted model's text part.
  check_rows: 2000
